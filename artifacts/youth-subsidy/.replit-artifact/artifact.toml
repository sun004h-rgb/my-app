kind = "web"
previewPath = "/"
title = "청년일자리도약장려금 관리 시스템"
version = "1.0.0"
id = "artifacts/youth-subsidy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23747

[services.development]
run = "pnpm --filter @workspace/youth-subsidy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/youth-subsidy", "run", "build" ]
publicDir = "artifacts/youth-subsidy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23747"
BASE_PATH = "/"
